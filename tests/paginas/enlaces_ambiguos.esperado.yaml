# Respuesta correcta (referencia) para enlaces_ambiguos.html. Vocabulario: ver perfecta.esperado.yaml
# tipo_falla: null (completable o con_dificultad) | no_encontrado | no_identificable | cierre_roto
pagina: enlaces_ambiguos.html
tareas:
  A:
    entrada: enlaces_ambiguos.html
    estado: completable
    estrategia: H_a_seccion
    tipo_falla: null
    ruta:
      - {tecla: H, rol: heading, nombre: "Contacto"}
      - {tecla: leer, rol: StaticText, nombre: "Teléfono: 667 555 0142"}
    razon: "La falla de esta página está en los enlaces; el contacto tiene encabezado."
  B:
    entrada: enlaces_ambiguos.html
    estado: con_dificultad
    estrategia: no_dirigida
    tipo_falla: null
    ruta:
      - {tecla: H, rol: heading, nombre: "Trámites"}
      - {tecla: leer_de_corrido, hasta: {rol: link, nombre: "Leer más"}}  # 27 elementos; el 6.º "Leer más" (tarjeta 9 de 12)
      - {tecla: Enter, resultado: "enlaces_ambiguos_tramite.html"}
      - {tecla: H, rol: heading, nombre: "Requisitos"}
      - {tecla: leer, rol: list, nombre: "Identificación oficial vigente; Comprobante de domicilio; Comprobante de pago del predial; Croquis del terreno"}
    razon: "Hay 8 'Leer más' y 4 'clic aquí' idénticos: en la lista de enlaces no se distingue cuál es el trámite, y los títulos de tarjeta no son encabezados (no hay salto a la tarjeta). Leyendo desde el encabezado 'Trámites' (el salto), cada tarjeta son 3 elementos (título, descripción, enlace): la tarjeta 9 queda a 8×3 + 3 = 27 elementos del salto. Eso supera UMBRAL_LECTURA = 15 y también el 25 del análisis de sensibilidad (con 10 y 15 igual)."
  C:
    entrada: enlaces_ambiguos.html
    estado: completable
    estrategia: enlace_por_nombre
    tipo_falla: null
    ruta:
      - {tecla: lista_enlaces, rol: link, nombre: "Requisitos de licencia de construcción (PDF)"}
      - {tecla: Enter, resultado: "PDF con capa de texto"}
    razon: "El enlace al PDF sí tiene nombre único; los íconos sin nombre no estorban."
  D:
    entrada: enlaces_ambiguos.html
    estado: completable
    estrategia: F_a_campos
    tipo_falla: null
    ruta:
      - {tecla: F, rol: textbox, nombre: "Nombre completo"}
      - {tecla: F, rol: textbox, nombre: "Correo electrónico"}
      - {tecla: F, rol: textbox, nombre: "Mensaje"}
    razon: "Formulario con etiquetas."
